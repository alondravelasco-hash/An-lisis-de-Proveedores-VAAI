                            <p className="text-sm md:text-[15px] text-stone-400 font-light leading-relaxed">
                                <strong className="text-stone-200 font-medium">Sugerencia Técnica:</strong> Dado que los 3 cotizaron modelos muy dispares (especialmente en Laptops y Barras de Video), si se requiere un modelo específico, se sugiere definir una ficha técnica estricta y solicitar una re-cotización para competir equitativamente.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);
            
            const slides = [
                <Slide1 key="s1" />,
                <Slide2 key="s2" />,
                <Slide3 key="s3" />,
                <SlideVideo key="svideo" />,
                <Slide4 key="s4" />,
                <Slide5 key="s5" />
            ];

            const nextSlide = () => setCurrentSlide(prev => (prev < slides.length - 1 ? prev + 1 : prev));
            const prevSlide = () => setCurrentSlide(prev => (prev > 0 ? prev - 1 : prev));

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'Space') nextSlide();
                    if (e.key === 'ArrowLeft') prevSlide();
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            return (
                <div className="h-screen w-screen flex flex-col relative overflow-hidden">
                    
                    {/* Header sutil */}
                    <header className="absolute top-0 w-full p-6 flex justify-between items-center z-50 animate-fade-in text-sm font-medium tracking-widest uppercase text-stone-500">
                        <div className="flex items-center gap-3">
                            <div className="w-1.5 h-1.5 rounded-full bg-apple-gold animate-pulse"></div>
                            VAAI Comparativa
                        </div>
                        <div className="tracking-[0.3em]">
                            {currentSlide + 1} / {slides.length}
                        </div>
                    </header>

                    <main className="flex-grow pt-20 pb-24 relative z-10 w-full max-w-7xl mx-auto">
                        {slides[currentSlide]}
                    </main>

                    {/* Controles de navegación Glassmorphism */}
                    <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2 z-50 flex items-center gap-4 p-2 glass-panel rounded-full animate-fade-in-up" style={{animationDelay: '1s'}}>
                        <button 
                            onClick={prevSlide}
                            disabled={currentSlide === 0}
                            className={`p-3 rounded-full transition-all ${currentSlide === 0 ? 'text-stone-700 cursor-not-allowed' : 'text-stone-300 hover:bg-apple-beige/10 hover:scale-105 active:scale-95'}`}
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        
                        <div className="flex gap-2 px-3">
                            {slides.map((_, idx) => (
                                <button 
                                    key={idx} 
                                    onClick={() => setCurrentSlide(idx)}
                                    className={`w-2 h-2 rounded-full transition-all duration-300 ${currentSlide === idx ? 'bg-apple-gold scale-125 w-4' : 'bg-stone-700 hover:bg-stone-500'}`}
                                />
                            ))}
                        </div>

                        <button 
                            onClick={nextSlide}
                            disabled={currentSlide === slides.length - 1}
                            className={`p-3 rounded-full transition-all ${currentSlide === slides.length - 1 ? 'text-stone-700 cursor-not-allowed' : 'text-stone-300 hover:bg-apple-beige/10 hover:scale-105 active:scale-95'}`}
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
